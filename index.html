        const RECOMMENDED_RECIPES = [
            'carbon black powder,iron ore', 
            'copper metal,zinc metal', 
            'epoxy resin,fiberglass', 
            'cement powder,gravel stones,sand,water liquid' 
        ];

        // App State
        let selectedItems = [];
        let mixResult = null;
        let isMixing = false;
        let discoveredRecipes = new Set();
        let searchQuery = "";
        let activeCategory = "All";
        const MAX_MIX_ITEMS = 5;
        const totalRecipes = Object.keys(recipes).length;
        let notificationTimer = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-count').innerText = totalRecipes;
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderInventory();
            });
            renderCategoryFilters();
            renderInventory();
            renderWorkbench();
            renderResult();
            renderRecommended();
        });

        // Helper: Image Generator URL
        function getImageUrl(prompt, type) {
            const finalPrompt = type === 'material' 
                ? `${prompt} raw material real photo`
                : `${prompt} real object product photography`;
            const safePrompt = encodeURIComponent(finalPrompt);
            return `https://tse2.mm.bing.net/th?q=${safePrompt}&w=300&h=300&c=7&rs=1&p=0&dpr=1&pid=1.7`;
        }

        // Helpers for fallback images if failed to load
        function getFallbackHtml(char) {
            return `<div class="flex items-center justify-center bg-slate-800 text-slate-500 font-bold text-xl w-full h-full">${char || '?'}</div>`;
        }

        function handleImgErr(img, char) {
            img.outerHTML = getFallbackHtml(char);
        }

        function showNotification(msg) {
            const toast = document.getElementById('notification-toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            if (notificationTimer) clearTimeout(notificationTimer);
            notificationTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }

        function handleCategoryClick(catId) {
            activeCategory = catId;
            renderCategoryFilters();
            renderInventory();
        }

        function handleSelectItem(matId) {
            mixResult = null;
            if (selectedItems.length >= MAX_MIX_ITEMS) {
                showNotification(`🧪 ช่องผสมเต็มแล้ว! (สูงสุด ${MAX_MIX_ITEMS} ชนิด) กรุณาเอาวัสดุออก หรือกด 'เริ่มสังเคราะห์'`);
                return;
            }
            if (selectedItems.find(item => item.id === matId)) {
                showNotification("⚠️ คุณเลือกวัสดุนี้ไปแล้ว ลองหยิบวัสดุอื่นมาผสมกันดูนะ");
                return;
            }
            const mat = baseMaterials.find(m => m.id === matId);
            selectedItems.push(mat);
            renderInventory(); // update selected state
            renderWorkbench();
            renderResult();
        }

        function handleRemoveItem(index) {
            selectedItems.splice(index, 1);
            mixResult = null;
            renderInventory();
            renderWorkbench();
            renderResult();
        }

        function handleReset() {
            selectedItems = [];
            mixResult = null;
            renderInventory();
            renderWorkbench();
            renderResult();
        }

        function handleAutoFill(recipeKey) {
            const materialIds = recipeKey.split(',');
            selectedItems = materialIds.map(id => baseMaterials.find(m => m.id === id)).filter(Boolean);
            mixResult = null;
            renderInventory();
            renderWorkbench();
            renderResult();
            showNotification("✅ จัดเตรียมวัตถุดิบสำหรับสูตรแนะนำเรียบร้อยแล้ว กด 'เริ่มสังเคราะห์' ได้เลย!");
            document.getElementById('workbench-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function handleMix() {
            if (selectedItems.length < 2) {
                showNotification("ต้องเลือกวัสดุอย่างน้อย 2 ชนิดเพื่อทำการผสม!");
                return;
            }
            isMixing = true;
            mixResult = null;
            renderWorkbench(); // update button state
            renderResult(); // show loading animation

            setTimeout(() => {
                isMixing = false;
                const ids = selectedItems.map(item => item.id).sort();
                const recipeKey = ids.join(',');
                
                if (recipes[recipeKey]) {
                    mixResult = { success: true, ...recipes[recipeKey] };
                    discoveredRecipes.add(recipeKey);
                    updateStats();
                    renderRecommended(); // Update unlocked badges
                } else {
                    let failMessage = 'ปฏิกิริยาไม่เสถียร! วัสดุเหล่านี้ผสมกันไม่ได้เกิดเป็นวัสดุที่ใช้งานได้จริง ลองจับคู่ใหม่ดูนะ';
                    let failEngName = 'pile of toxic chemical sludge, dirty';
                    if (selectedItems.length > 3) {
                        failMessage = 'ส่วนผสมซับซ้อนเกินไปและขัดแย้งกันเอง! กลายเป็นก้อนของแข็งไร้ประโยชน์จากห้องแล็บ';
                        failEngName = 'broken pieces of unidentified grey solid material waste';
                    }
                    mixResult = { 
                        success: false, 
                        name: 'ตะกอนสารเคมี (ล้มเหลว)', 
                        engName: failEngName,
                        desc: failMessage
                    };
                }
                
                renderWorkbench();
                renderResult();
                
                setTimeout(() => {
                    document.getElementById('result-section').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);

            }, 2500);
        }

        function updateStats() {
            document.getElementById('discovered-count').innerText = discoveredRecipes.size;
            document.getElementById('progress-bar').style.width = `${(discoveredRecipes.size / totalRecipes) * 100}%`;
        }

        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            let html = `<button onclick="handleCategoryClick('All')" class="shrink-0 px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all snap-start ${activeCategory === 'All' ? 'bg-slate-700 text-white shadow-md' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">All</button>`;
            
            Object.values(CATEGORIES).forEach(cat => {
                const isActive = activeCategory === cat.id;
                html += `
                    <button onclick="handleCategoryClick('${cat.id}')" class="shrink-0 px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold flex items-center gap-1.5 transition-all snap-start ${isActive ? `bg-slate-800 border ${cat.border} ${cat.text} shadow-[0_0_10px_rgba(255,255,255,0.05)]` : 'bg-slate-900/50 border border-transparent text-slate-500 hover:text-slate-300'}">
                        <span>${cat.icon}</span> ${cat.name}
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            const filtered = baseMaterials.filter(mat => {
                const matchesSearch = mat.name.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = activeCategory === "All" || mat.type === activeCategory;
                return matchesSearch && matchesCategory;
            });
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">ไม่พบวัสดุที่ค้นหา</div>`;
                return;
            }

            let html = '';
            filtered.forEach(mat => {
                const isSelected = selectedItems.find(item => item.id === mat.id);
                const imgSrc = getImageUrl(mat.id, 'material');
                html += `
                    <button onclick="handleSelectItem('${mat.id}')" ${isSelected ? 'disabled' : ''} class="relative flex flex-col items-center justify-start p-2 md:p-2.5 rounded-xl border transition-all duration-300 group overflow-hidden ${isSelected ? 'border-slate-700 bg-slate-900 opacity-40 cursor-not-allowed scale-95 grayscale' : 'border-slate-700 bg-slate-800 hover:bg-slate-700 hover:border-cyan-500 hover:-translate-y-1 hover:shadow-lg'}">
                        <div class="w-14 h-14 sm:w-20 sm:h-20 mb-1.5 md:mb-2 rounded-lg overflow-hidden border border-slate-600/50 relative z-10 shadow-inner group-hover:scale-105 transition-transform bg-slate-900 shrink-0">
                            <img src="${imgSrc}" alt="${mat.name}" class="w-full h-full object-cover bg-slate-900" loading="lazy" onerror="handleImgErr(this, '${mat.name.charAt(0)}')" />
                            <div class="absolute top-0 right-0 bg-black/70 backdrop-blur-sm text-[10px] px-1 py-0.5 rounded-bl-lg border-b border-l border-slate-600/50 z-20">${mat.icon}</div>
                            ${isSelected ? `<div class="absolute inset-0 flex items-center justify-center bg-black/60 z-30"><span class="text-xl md:text-2xl drop-shadow-lg">✅</span></div>` : ''}
                        </div>
                        <div class="text-[10px] md:text-xs font-bold text-slate-300 text-center leading-tight z-10 px-0.5 md:px-1 w-full truncate" title="${mat.name}">${mat.name}</div>
                    </button>
                `;
            });
            grid.innerHTML = html;
        }

        function renderWorkbench() {
            const slotsContainer = document.getElementById('workbench-slots');
            let slotsHtml = '';
            
            selectedItems.forEach((item, index) => {
                const imgSrc = getImageUrl(item.id, 'material');
                if (index > 0) {
                    slotsHtml += `<div class="text-xl md:text-2xl font-black text-slate-600 animate-pop-in">➕</div>`;
                }
                slotsHtml += `
                    <div onclick="handleRemoveItem(${index})" class="w-16 h-16 sm:w-20 sm:h-20 md:w-32 md:h-32 rounded-xl md:rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 border-[2px] md:border-[3px] relative group animate-pop-in overflow-hidden bg-slate-800 shadow-[0_0_20px_rgba(0,0,0,0.4)] hover:shadow-red-500/30 hover:border-red-500/50" style="border-color: rgba(255,255,255,0.05)">
                        <img src="${imgSrc}" class="absolute inset-0 w-full h-full object-cover opacity-60 group-hover:opacity-20 transition-opacity" onerror="this.onerror=null; this.style.display='none'" />
                        <span class="text-xl md:text-3xl z-10 bg-black/60 p-1 md:p-1.5 rounded-full backdrop-blur-md border border-white/10 mb-0.5 md:mb-2 shadow-lg">${item.icon}</span>
                        <span class="text-[8px] md:text-xs font-bold text-center px-1 md:px-2 py-0.5 z-10 bg-black/70 backdrop-blur-md rounded border border-white/10 text-white shadow-lg truncate w-11/12">${item.name}</span>
                        <div class="absolute inset-0 bg-red-500/80 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity z-20 backdrop-blur-sm">
                            <span class="text-white font-bold text-[10px] md:text-sm drop-shadow-md">ออก ❌</span>
                        </div>
                    </div>
                `;
            });

            if (selectedItems.length < MAX_MIX_ITEMS) {
                if (selectedItems.length > 0) {
                    slotsHtml += `<div class="text-xl md:text-2xl font-black text-slate-700">➕</div>`;
                }
                slotsHtml += `
                    <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-32 md:h-32 rounded-xl md:rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-slate-600 bg-slate-900/50 text-slate-500 shadow-inner">
                        <span class="text-[10px] md:text-sm font-medium">เพิ่มวัสดุ</span>
                        <span class="text-[8px] md:text-xs mt-0.5 md:mt-1">(${selectedItems.length}/${MAX_MIX_ITEMS})</span>
                    </div>
                `;
            }
            slotsContainer.innerHTML = slotsHtml;

            // Render Mix Button
            const btnContainer = document.getElementById('mix-button-container');
            const canMix = selectedItems.length >= 2 && !isMixing;
            let btnHtml = `
                <button onclick="handleMix()" ${!canMix ? 'disabled' : ''} class="relative overflow-hidden px-6 md:px-10 py-3 md:py-3.5 rounded-2xl font-extrabold text-sm md:text-lg tracking-wide shadow-2xl transition-all duration-300 transform ${canMix ? 'bg-slate-800 text-white border border-cyan-500/50 hover:scale-105 hover:shadow-[0_0_40px_rgba(34,212,238,0.5)] group' : 'bg-slate-900 text-slate-600 cursor-not-allowed border border-slate-800'}">
                    ${canMix ? '<div class="absolute inset-0 bg-gradient-to-r from-cyan-600 to-indigo-600 opacity-80 group-hover:opacity-100 transition-opacity"></div>' : ''}
            `;
            
            if (isMixing) {
                btnHtml += `
                    <span class="flex items-center gap-2 md:gap-3 text-cyan-300 relative z-10">
                        <div class="w-4 h-4 md:w-5 md:h-5 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                        กำลังประมวลผล...
                    </span>
                `;
            } else {
                btnHtml += `
                    <span class="relative z-10 flex items-center gap-1.5 md:gap-2">
                        <span class="text-lg md:text-xl">✨</span> เริ่มสังเคราะห์ 
                        <span class="bg-black/30 text-[10px] md:text-xs px-1.5 md:px-2 py-0.5 rounded-md ml-1 shadow-inner border border-white/10">${selectedItems.length} ชนิด</span>
                    </span>
                `;
            }
            btnHtml += `</button>`;
            btnContainer.innerHTML = btnHtml;
        }

        function renderResult() {
            const container = document.getElementById('result-section');
            if (!isMixing && !mixResult) {
                container.innerHTML = `<div class="h-[150px] md:h-[200px] flex items-center justify-center text-slate-600 text-xs md:text-sm italic px-4 text-center">ลากหรือคลิกวัสดุด้านบน เพื่อเริ่มการทดลอง...</div>`;
                return;
            }

            if (isMixing) {
                container.innerHTML = `
                    <div class="h-[300px] md:h-[350px] flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-sm z-10">
                        <div class="relative w-20 h-20 md:w-24 md:h-24">
                            <div class="absolute inset-0 border-[4px] md:border-[6px] border-slate-800 rounded-full"></div>
                            <div class="absolute inset-0 border-[4px] md:border-[6px] border-cyan-500 border-t-transparent border-l-transparent rounded-full animate-[spin_1s_linear_infinite]"></div>
                            <div class="absolute inset-2 md:inset-3 border-[4px] md:border-[6px] border-fuchsia-500 border-b-transparent border-r-transparent rounded-full animate-[spin_1.5s_linear_reverse_infinite]"></div>
                            <div class="absolute inset-0 flex items-center justify-center text-2xl md:text-3xl animate-pulse">🧬</div>
                        </div>
                        <p class="text-cyan-400 font-bold mt-4 md:mt-6 tracking-widest uppercase text-xs md:text-sm animate-pulse">Synthesizing Materials...</p>
                    </div>
                `;
                return;
            }

            if (mixResult) {
                const imgSrc = getImageUrl(mixResult.engName || mixResult.name, 'product');
                const gradientClass = mixResult.success ? 'from-cyan-950/90 to-indigo-950/90' : 'from-red-950/90 to-orange-950/90';
                const borderShadowClass = mixResult.success ? 'border-cyan-500/40 shadow-[0_0_50px_rgba(34,212,238,0.3)]' : 'border-red-500/40 shadow-[0_0_50px_rgba(239,68,68,0.3)]';
                const titleColor = mixResult.success ? 'text-white' : 'text-red-400';
                
                let html = `
                    <div class="p-5 md:p-10 w-full min-h-[300px] md:min-h-[350px] animate-slide-up bg-gradient-to-br ${gradientClass} flex flex-col justify-center">
                        <div class="flex flex-col md:flex-row items-center md:items-start gap-6 md:gap-10 max-w-6xl mx-auto w-full">
                            <div class="relative flex items-center justify-center w-40 h-40 md:w-64 md:h-64 rounded-2xl md:rounded-3xl shrink-0 overflow-hidden border-4 ${borderShadowClass}">
                                <img src="${imgSrc}" class="w-full h-full object-cover transform hover:scale-110 transition-transform duration-700 ${!mixResult.success ? 'grayscale contrast-125 brightness-75' : ''}" onerror="handleImgErr(this, '${mixResult.name.charAt(0)}')" />
                                ${mixResult.success ? '<div class="absolute -top-2 -right-2 md:-top-3 md:-right-3 bg-gradient-to-r from-amber-400 to-yellow-500 text-yellow-950 text-[10px] md:text-xs font-black px-3 py-1 md:px-4 md:py-1.5 rounded-full shadow-lg transform rotate-12 uppercase tracking-wide border border-yellow-200 z-10">สำเร็จ!</div>' : ''}
                            </div>
                            <div class="flex-1 text-center md:text-left w-full">
                                <div class="flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 md:gap-3 mb-4">
                                    <h3 class="text-2xl md:text-4xl font-extrabold tracking-tight ${titleColor}">${mixResult.name}</h3>
                                    ${mixResult.success ? `<span class="bg-indigo-500/20 border border-indigo-500/50 text-indigo-300 text-[10px] md:text-xs px-2.5 py-1 rounded-full font-bold shadow-inner">${mixResult.tag}</span>` : ''}
                                </div>
                                <p class="text-slate-300 text-sm md:text-lg mb-5 md:mb-6 leading-relaxed bg-black/30 p-4 md:p-5 rounded-xl md:rounded-2xl border border-white/5 backdrop-blur-sm shadow-inner text-left">${mixResult.desc}</p>
                `;
                
                if (mixResult.success) {
                    html += `
                                <div class="flex items-start gap-3 md:gap-4 bg-cyan-900/30 p-4 md:p-5 rounded-xl md:rounded-2xl border border-cyan-500/30 shadow-lg relative overflow-hidden text-left">
                                    <div class="absolute top-0 right-0 w-24 h-24 md:w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl -mr-10 -mt-10"></div>
                                    <div class="text-2xl md:text-3xl mt-0.5 md:mt-1 drop-shadow-md shrink-0">🛠️</div>
                                    <div class="relative z-10">
                                        <strong class="text-cyan-400 block mb-1 text-xs md:text-sm uppercase tracking-wide">การประยุกต์ใช้งาน:</strong>
                                        <span class="text-slate-200 leading-snug block text-sm md:text-lg">${mixResult.uses}</span>
                                    </div>
                                </div>
                    `;
                }

                html += `
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            }
        }

        function renderRecommended() {
            const container = document.getElementById('recommended-grid');
            let html = '';
            RECOMMENDED_RECIPES.forEach(recipeKey => {
                const recipeInfo = recipes[recipeKey];
                const isDiscovered = discoveredRecipes.has(recipeKey);
                const imgSrc = getImageUrl(recipeInfo.engName, 'product');
                
                html += `
                    <div class="bg-slate-800/50 rounded-2xl border border-slate-700/50 overflow-hidden flex flex-col hover:border-cyan-500/50 hover:bg-slate-800 transition-all group">
                        <div class="h-40 relative overflow-hidden bg-slate-900 border-b border-slate-700/50">
                            <img src="${imgSrc}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-110 transition-all duration-500" onerror="handleImgErr(this, '${recipeInfo.name.charAt(0)}')" />
                            ${isDiscovered ? `<div class="absolute top-3 right-3 bg-emerald-500/90 text-white text-[10px] font-bold px-2 py-1 rounded-md shadow-lg backdrop-blur-sm z-10 flex items-center gap-1"><span>✅</span> ปลดล็อกแล้ว</div>` : ''}
                        </div>
                        <div class="p-4 flex flex-col flex-1">
                            <h3 class="font-bold text-cyan-400 text-lg mb-1">${recipeInfo.name}</h3>
                            <p class="text-xs text-slate-400 mb-4 line-clamp-2 overflow-hidden" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${recipeInfo.desc}</p>
                            <button onclick="handleAutoFill('${recipeKey}')" class="mt-auto w-full py-2 bg-slate-700 hover:bg-cyan-600 text-white text-sm font-semibold rounded-xl transition-colors shadow-md border border-slate-600 hover:border-cyan-400">
                                ลองผสมสูตรนี้ 🧪
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }
    </script>
</body>
</html>
